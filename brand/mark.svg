<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    abacad — 叠 / Two panes

    Two identical panes: 62 × 62, rx 15. The front one sits 22 down and 22 right
    (45°), leaving 5 of air between them on both arms. The front pane's silhouette
    cuts the back one into a 17-wide L — the "and there are more behind it" shape.

    Front  #13A7F5  (the page you are looking at)
    Back   #FD605E  (everything else still open)

    The air is not drawn: it is the gap the mask leaves.
  -->
  <defs>
    <mask id="air">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="25" y="25" width="72" height="72" rx="20" fill="#000"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="62" height="62" rx="15" fill="#fd605e" mask="url(#air)"/>
  <rect x="30" y="30" width="62" height="62" rx="15" fill="#13a7f5"/>
</svg>
