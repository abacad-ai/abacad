<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    A · 接 / Joint
    One tile, split by a hairline seam that never runs straight: at the middle the seam
    turns into a ball-and-socket. The blue half pushes a ⌀34 ball into the coral half;
    the coral half answers with a ⌀43 socket. The gap is 4.5 everywhere — along the
    seam and around the ball — so the two halves read as one hinge, not one cut.

    This is open-linux-router's tangency (a circle tangent to a line), moved into a tile.
  -->
  <defs>
    <clipPath id="tile">
      <rect x="8" y="8" width="84" height="84" rx="26"/>
    </clipPath>
    <mask id="socket" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="50" r="21.5" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="47.75" height="100" fill="#13a7f5"/>
    <circle cx="50" cy="50" r="17" fill="#13a7f5"/>
    <g mask="url(#socket)">
      <rect x="52.25" y="0" width="47.75" height="100" fill="#fd605e"/>
    </g>
  </g>
</svg>
