<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    C · 开口 / Open Ring
    The ring never closes. Two arcs of the same ring (r 30.5, stroke 23) with round
    ends — the caps are olr's two dots, r 11.5, turned into the two ports of one pipe.
    Openings sit at 12 and 6 o'clock; the visible gap between the cap faces is 20°.
  -->
  <path d="M33.77 75.82A30.5 30.5 0 0 1 33.77 24.18" stroke="#13a7f5" stroke-width="23" stroke-linecap="round"/>
  <path d="M66.23 24.18A30.5 30.5 0 0 1 66.23 75.82" stroke="#fd605e" stroke-width="23" stroke-linecap="round"/>
</svg>
