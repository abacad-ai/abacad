# abacad over bridge networking — for macOS/Windows Docker Desktop, or any host
# where host networking is unavailable.
#
#   docker compose -f compose.bridge.yaml up -d
#
# Everything — the web UI, the API and every device's VNC WebSocket — goes
# through the one HTTP port. This is the whole port mapping: there is no
# 5901-5999 range, because every device is a path (/ws/vnc/<id>) on 8787.
# The trade-off against host networking is that the hub sees Docker's NAT
# address instead of the real client IP.
services:
  abacad:
    image: ghcr.io/abacad-ai/abacad:latest
    container_name: abacad
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      ABACAD_CONFIG: /config/config.yaml
      ABACAD_LISTEN: 0.0.0.0:8787
    volumes:
      - abacad-config:/config

volumes:
  abacad-config:
