<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>abacad — view</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #101211; --surface: #181b19; --ink: #ecebe5; --muted: #9b9e96;
    --line: #2a2e2a; --accent: #66c7b1;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { display: flex; flex-direction: column; }
  header {
    height: 48px; flex: 0 0 48px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .left, .right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  a.back {
    color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 9px;
    border-radius: 8px; border: 1px solid var(--line); white-space: nowrap;
  }
  a.back:hover { color: var(--ink); }
  .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  button {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { color: var(--ink); }
  iframe { border: 0; width: 100%; height: 100%; flex: 1 1 auto; background: #000; }
  .frame { flex: 1 1 auto; min-height: 0; display: flex; position: relative; }
  .hint { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .type-hint {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    z-index: 5; pointer-events: none; white-space: nowrap;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(12, 14, 13, .78); color: #f2f1ec;
    font-size: 12px; box-shadow: 0 8px 30px -12px rgba(0,0,0,.7);
    transition: opacity .25s ease;
  }
  .type-hint.gone { opacity: 0; }
  @media (max-width: 700px) { .type-hint { white-space: normal; width: calc(100% - 32px); text-align: center; } .hint { display: none; } }
</style>
</head>
<body>
<header>
  <div class="left">
    <a class="back" href="/">← Hub</a>
    <span class="dot" aria-hidden="true"></span>
    <span class="name" id="name">connecting…</span>
  </div>
  <div class="right">
    <span class="hint" id="hint">noVNC · RFB 3.8</span>
    <button id="keyboard" type="button">Keyboard</button>
    <button id="reload" type="button">Reconnect</button>
    <button id="full" type="button">Fullscreen</button>
  </div>
</header>
<div class="frame">
  <iframe id="view" allow="clipboard-read; clipboard-write; fullscreen" title="VNC session"></iframe>
  <div id="type-hint" class="type-hint">Click the screen, then type · macOS lock screen: press Space or click your user</div>
</div>
<script>
  const id = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  const frame = document.getElementById("view");
  const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
  const params = new URLSearchParams({
    autoconnect: "1",
    path: `${wsProto}//${location.host}/ws/vnc/${encodeURIComponent(id)}`,
    resize: "scale",
    reconnect: "1",
    reconnect_delay: "1500",
    quality: "7",
    compression: "1",
    show_dot: "1",
    view_only: "0",
  });
  const src = `/novnc/vnc.html?${params.toString()}`;
  frame.src = src;
  document.getElementById("name").textContent = id;

  const typeHint = document.getElementById("type-hint");
  const hideHint = () => typeHint.classList.add("gone");

  function focusRemoteKeyboard() {
    try {
      const doc = frame.contentDocument;
      const canvas = doc.querySelector("canvas");
      if (canvas) canvas.focus();
      const kbButton = doc.getElementById("noVNC_keyboard_button");
      if (kbButton && !kbButton.classList.contains("noVNC_selected")) kbButton.click();
      const input = doc.getElementById("noVNC_keyboardinput");
      if (input) input.focus();
    } catch (e) { /* cross-origin should not happen; ignore */ }
    hideHint();
  }

  frame.addEventListener("load", () => {
    // noVNC builds its canvas asynchronously. Poll briefly so the remote screen
    // becomes the keyboard target without the user having to find it first.
    let tries = 0;
    const timer = setInterval(() => {
      tries++;
      try {
        const doc = frame.contentDocument;
        const canvas = doc.querySelector("canvas");
        if (canvas) {
          canvas.focus();
          doc.addEventListener("pointerdown", hideHint, { once: true });
          clearInterval(timer);
          return;
        }
      } catch (e) { /* ignore */ }
      if (tries > 20) clearInterval(timer);
    }, 300);
  });

  document.getElementById("keyboard").addEventListener("click", focusRemoteKeyboard);

  document.getElementById("reload").addEventListener("click", () => {
    typeHint.classList.remove("gone");
    frame.src = "about:blank";
    setTimeout(() => { frame.src = src; }, 80);
  });
  document.getElementById("full").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch { /* user gesture required */ }
  });
</script>
</body>
</html>
