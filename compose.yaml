# abacad — the supported Linux deployment.
#
#   docker compose up -d
#   docker compose logs abacad | grep "admin token"
#
# Host networking matters here: mDNS discovery/advertising, real client IPs and
# the dynamically allocated raw VNC ports (5901-5999) all depend on it. On
# macOS and Windows, Docker Desktop's host networking is limited — run the
# native binary there instead, or use compose.bridge.yaml.
services:
  abacad:
    image: ghcr.io/abacad-ai/abacad:latest
    container_name: abacad
    network_mode: host
    restart: unless-stopped
    environment:
      ABACAD_CONFIG: /config/config.yaml
      ABACAD_LISTEN: 0.0.0.0:8787
      # A token from your secret store beats the generated one; it is never
      # written to config.yaml.
      # ABACAD_ADMIN_TOKEN: replace-with-at-least-16-characters
      # ABACAD_MDNS: "false"
    volumes:
      - abacad-config:/config
    # To keep config.yaml on the host instead, bind-mount a directory owned by
    # uid 10001 (the image's user):
    #   - ./config:/config
    #   sudo chown -R 10001 ./config

volumes:
  abacad-config:
