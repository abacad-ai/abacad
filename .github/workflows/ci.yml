name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast Go-only checks. dist/ and docs-dist/ are generated, not committed, so
  # this compiles against the .gitkeep stubs — which is exactly the fresh-clone
  # state we want to keep working. The `server` job below covers the real embed.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # End-to-end server build: SPA + docs + embed + link the binary, via the same
  # script releases use. Since the built assets are no longer committed, this is
  # what proves they still embed and that the shipped binary actually builds.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: ./build.sh
        working-directory: server
      # Guard the whole point of this change: a full build must leave the embed
      # dirs free of tracked changes. Scoped to those dirs on purpose — build.sh
      # runs `npm install`, which can legitimately touch a lockfile, and that is
      # a different problem from a generated asset escaping .gitignore.
      - name: Build artifacts stay untracked
        run: |
          dirty="$(git status --porcelain -- server/backend/internal/web)"
          if [ -n "$dirty" ]; then
            echo "::error::build.sh left tracked changes under internal/web — a generated asset is escaping .gitignore:"
            echo "$dirty"
            exit 1
          fi

  # Windows client — build only, on the self-hosted NUC. Since the WinUI 3
  # (Windows App SDK) rewrite this cannot cross-build on Linux, so a cloud runner
  # can't cover it and breakage would otherwise surface only at tag time — which
  # is how v0.4.1 shipped with no Windows binary at all.
  #
  # bash because the Makefile recipes are POSIX (the Windows default is pwsh);
  # Git Bash, GNU make and the .NET 8 SDK are on the box's machine PATH.
  windows:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: make windows-release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
