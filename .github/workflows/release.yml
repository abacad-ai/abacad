# Build every client and publish them to a GitHub Release.
#
# Trigger with a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Each client builds on the runner that has its toolchain and signing material:
#   - Linux (CLI/daemon) cross-builds on a free cloud runner.
#   - Windows (tray) builds on the self-hosted NUC: the WinUI 3 / Windows App SDK
#     client needs a real Windows host, so it can no longer cross-build. That box
#     needs Git for Windows, GNU make and the .NET 8 SDK on the MACHINE PATH, and
#     each must be READABLE BY "NT AUTHORITY\NETWORK SERVICE" — the runner is a
#     service under that account, so it sees neither a user PATH nor anything
#     ACL'd to Administrators. (winget's machine-scope *portable* installs are the
#     trap: they drop a symlink in Program Files\WinGet\Links pointing into a
#     Packages dir that only Administrators can read, so `where make` finds it but
#     exec fails with a bare "command not found".)
#   - macOS (.dmg, Developer ID + notarized) and Android (signed APK) build on
#     the self-hosted Mac mini, where the keys live — they never touch GitHub
#     secrets. See the repo README / Makefile header for the box's prerequisites
#     (Developer ID cert + `abacad-notary` profile in ci.keychain — NOT the login
#     keychain — unlocked per-job from ~/.config/ci-keychain.pw, plus
#     ~/.abacad/android-release.jks + ~/.gradle/gradle.properties).
#
# Each job builds its client and stages it (via `make stage-<platform>`) under the
# repo-wide name abacad-<kind>-<version>-<platform>-<arch>.<suffix>, where kind is
# `app` (the one with a window) or `cli` (the one you run in a terminal). Most
# platforms publish both. The release job then gathers them, generates
# manifest.json over the set, and publishes everything — so the infra deploy can
# `gh release download <tag>` and drop the artifacts + manifest onto the volume
# with no renaming. The manifest is what every consumer reads (downloads page,
# install.sh); there is no "latest" filename anymore.
#
# workflow_dispatch runs every build job as a smoke test but publishes nothing —
# the release job is gated on a v* tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release run per ref; a newer tag push cancels an in-flight build of the
# same ref rather than racing it to the Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux client — the CLI (pure Go, cross-compiled amd64 + arm64) and the ───
  # GTK4/libadwaita desktop app as a .deb. The app links cgo against the runner's
  # own GTK, so unlike the CLI it does not cross-compile: amd64 only, and an arm64
  # .deb would need an arm64 runner. The arm64 CLI tarball still ships.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: linux/go.sum
      - run: make linux-release
      - name: GTK4 + libadwaita dev packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev
      - run: make linux-deb
      - run: make stage-linux DOWNLOADS=dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  # ── Windows tray app — self-contained single exe, built on Windows ───────────
  # Self-hosted NUC. Since the WinUI 3 (Windows App SDK) rewrite this can no
  # longer cross-build on Linux — the Windows App SDK targets resolve only on a
  # Windows host — so it runs on the box that has the .NET 8 SDK provisioned,
  # the same way macOS/Android lean on the Mac mini.
  #
  # bash (Git Bash, on the runner's PATH) because the Makefile recipes are POSIX;
  # the Windows default shell would be pwsh. GNU make is on the machine PATH.
  #
  # The csproj stamps its Version from the repo-root VERSION file at build time,
  # so there is nothing to inject here — the whole monorepo shares one number.
  windows:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build + stage self-contained exe
        run: |
          make windows-release
          make stage-windows DOWNLOADS=dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  # ── Windows CLI — same agent, no WinUI, so it cross-builds on a cloud runner ──
  # Deliberately NOT on the self-hosted NUC: windows/cli/Abacad.Cli.csproj drops
  # the Windows App SDK reference and sets EnableWindowsTargeting, which is the
  # whole reason it can build here. Keeping it on a cloud runner also means a NUC
  # that is offline costs us the tray app, not the CLI too.
  windows-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - run: make windows-cli-release
      - run: make stage-windows DOWNLOADS=dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: dist/
          if-no-files-found: error

  # ── macOS menu-bar app — signed, notarized, stapled .dmg ─────────────────────
  # Self-hosted Mac mini. A login zsh gives the same PATH as an interactive
  # shell (~/.zshenv → go, ~/.zprofile → brew shellenv), which the LaunchAgent
  # runner otherwise lacks.
  macos:
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        shell: zsh -l -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      # The Developer ID identity AND the abacad-notary profile live in
      # ci.keychain, not the login keychain. This box has no auto-login (a
      # deliberate choice — auto-login would store the account password in
      # /etc/kcpassword), so the runner has no logged-in desktop session and
      # EVERY keychain is locked when a job starts. Without this, codesign fails
      # with a bare `errSecInternalComponent` that names neither the keychain nor
      # the lock. The password is a random throwaway that exists only on this
      # machine (mode 600) — deliberately not a GitHub secret, so the signing
      # material never leaves the box.
      - name: Unlock the signing keychain
        run: |
          security unlock-keychain -p "$(cat ~/.config/ci-keychain.pw)" ci.keychain
          security set-keychain-settings ci.keychain   # no auto-lock while we build
      - name: Build, sign & notarize
        run: make macos-release
      # The CLI rides in the same job rather than its own: it needs the same
      # unlocked ci.keychain, and the Mac mini is a single self-hosted runner, so
      # a second macOS job would queue behind this one for no gain.
      - name: Build, sign & notarize the CLI
        run: make macos-cli-release
      - name: Stage under the published name
        run: make stage-macos DOWNLOADS=dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  # ── Android app — signed release APK ─────────────────────────────────────────
  # Same Mac mini; keystore + credentials already provisioned there.
  android:
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        shell: zsh -l -e -o pipefail {0}
    env:
      JAVA_HOME: /opt/homebrew/opt/openjdk@17
    steps:
      - uses: actions/checkout@v4
        with:
          # LibVNCServer (the in-app RFB server) is a submodule under
          # android/app/src/main/cpp/ — the APK build won't compile without it.
          submodules: recursive
      - name: Assemble signed release APK
        run: |
          export ANDROID_HOME="$HOME/Library/Android/sdk"
          make android-release
      - name: Stage under the published name
        run: make stage-android DOWNLOADS=dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          if-no-files-found: error

  # ── Gather every artifact and publish the GitHub Release ─────────────────────
  # Only on a real tag; a workflow_dispatch smoke run stops after the builds.
  release:
    needs: [linux, windows, windows-cli, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Every client stamps its build from the repo-root VERSION file, so the tag
      # must agree with it — otherwise the Release name and the binaries inside
      # would report different versions. Bump VERSION, commit, then tag v<VERSION>.
      - name: Tag must match VERSION
        run: |
          want="v$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "$want" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != v$(cat VERSION) (run 'make bump-version' and re-tag)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Generate the manifest over the gathered artifacts, so it ships alongside
      # them in the Release (and thus onto the deploy volume) — the same static
      # manifest.json the server serves and every client reads.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate downloads manifest
        run: node scripts/gen-manifest.mjs dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
