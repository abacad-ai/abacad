name: release

# Tag v2.0.0 → ghcr.io/abacad-ai/abacad:2.0.0, :2.0, :2, :latest.
# Manual dispatch on any branch → :edge, for trying the full pipeline without
# cutting a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Semver without the "v" prefix, e.g. 2.0.0 — the tag users pull.
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
          labels: |
            org.opencontainers.image.title=abacad
            org.opencontainers.image.description=A small self-hosted VNC hub.

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image (linux/amd64, linux/arm64):

            ```bash
            docker run -d --name abacad --network host \
              -v abacad-config:/config \
              ghcr.io/${{ github.repository }}:${{ needs.image.outputs.version }}
            docker logs abacad   # prints the admin token
            ```

            Or `docker compose up -d` with the `compose.yaml` in this repo.
            Admin token, listen address and mDNS can be set with
            `ABACAD_ADMIN_TOKEN`, `ABACAD_LISTEN` and `ABACAD_MDNS`.
