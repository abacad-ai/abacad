<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    abacad — favicon cut

    Same two panes as mark.svg, but the air is widened from 5 to 8 so the gap
    survives at 16 px (8 → 1.3 px) instead of closing into one blob. The panes
    keep their exact size and offset; only the mask moves.
  -->
  <defs>
    <mask id="air">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="22" y="22" width="78" height="78" rx="23" fill="#000"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="62" height="62" rx="15" fill="#fd605e" mask="url(#air)"/>
  <rect x="30" y="30" width="62" height="62" rx="15" fill="#13a7f5"/>
</svg>
